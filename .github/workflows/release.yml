name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          for _ in $(seq 30); do
            run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 \
              --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::No CI run on $GITHUB_SHA: push the commit to main with the tag"
            exit 1
          fi
          gh run watch "$run" --exit-status
          gh run download "$run" --name mothership-x86_64
      - run: |
          mv mothership mothership-x86_64
          sha256sum mothership-x86_64 > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" mothership-x86_64 SHA256SUMS --generate-notes

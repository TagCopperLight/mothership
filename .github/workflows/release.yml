name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mothership-x86_64
      - run: |
          mv mothership mothership-x86_64
          sha256sum mothership-x86_64 > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" mothership-x86_64 SHA256SUMS --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

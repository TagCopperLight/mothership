name: Release

# A new machine downloads mothership instead of building it, so each version tag publishes a
# static binary that runs on Arch, Debian and Ubuntu alike, with its checksum. Only x86_64 for
# now: hardware detection reads the CPU vendor, which ARM kernels don't report.
on:
  push:
    tags: ["v*"]

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: |
          cp target/x86_64-unknown-linux-musl/release/mothership mothership-x86_64
          sha256sum mothership-x86_64 > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" mothership-x86_64 SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

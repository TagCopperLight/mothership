[package]
name = "mothership"
version = "0.1.0"
edition = "2024"
# tests/ holds unit tests that the modules include, not standalone test crates.
autotests = false

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
anyhow = "1.0.104"
globset = "0.4.21"
libc = "0.2.191"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
terminal_size = "0.4.4"
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-width = "0.2.3"

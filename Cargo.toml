[package]
name = "mothership"
version = "1.0.0"
edition = "2024"
autotests = false

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
anyhow = "1.0.104"
base64 = "0.22.1"
globset = "0.4.21"
libc = "0.2.191"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std", "alloc", "getrandom"] }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
terminal_size = "0.4.4"
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-width = "0.2.3"
yaml_serde = "0.10.7"
